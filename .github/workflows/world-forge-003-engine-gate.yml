name: WORLD-FORGE-003 engine gate

on:
  pull_request:
    paths:
      - 'experiments/world-forge-003/**'
      - '.github/workflows/world-forge-003-engine-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test experiments/world-forge-003/tests/reconcile.test.mjs
      - run: |
          node -e "const p=require('./experiments/world-forge-003/minecraft/pack.mcmeta'); if(JSON.stringify(p.pack.min_format)!=='[101,1]') process.exit(1)"
  godot-real-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned official Godot 4.4.1 editor
        run: |
          curl --fail --location --retry 2 --silent --show-error https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --version
      - name: Import and run the Godot scene, require runtime emission
        shell: bash
        run: |
          set -euo pipefail
          godot=/tmp/Godot_v4.4.1-stable_linux.x86_64
          scene=experiments/world-forge-003/godot
          "$godot" --headless --editor --import --path "$scene" --quit 2>&1 | tee /tmp/godot-import.log
          "$godot" --headless --path "$scene" --quit-after 4 2>&1 | tee /tmp/godot-runtime.log
          grep '^WORLD_FORGE_ENGINE_PROBE=' /tmp/godot-runtime.log
          if grep -Eiq '(SCRIPT ERROR|Parser Error|Parse Error)' /tmp/godot-runtime.log /tmp/godot-import.log; then exit 1; fi
          echo "Passed: scripted 3D Godot scene emitted an unverified self-report."
