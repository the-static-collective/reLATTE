name: VANILLA-WORLDBUILDER-006 autonomous authored world

on:
  push:
    branches:
      - experiment/vanilla-worldbuilder-006
    paths:
      - "experiments/vanilla-worldbuilder-006/**"
      - "experiments/polyglot-crossing-001/common.ts"
      - "test/vanilla-worldbuilder-006.test.ts"
      - ".github/workflows/vanilla-worldbuilder-006.yml"
  pull_request:
    paths:
      - "experiments/vanilla-worldbuilder-006/**"
      - "experiments/polyglot-crossing-001/common.ts"
      - "test/vanilla-worldbuilder-006.test.ts"
      - ".github/workflows/vanilla-worldbuilder-006.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authored-world:
    name: tell vanilla "BUILD A WORLD" and preserve what exists
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Run bounded grammar tests
        run: |
          npm install
          node --test --experimental-strip-types test/vanilla-worldbuilder-006.test.ts

      - name: Install pinned Minecraft clients
        run: |
          npm install --no-save --ignore-scripts             mineflayer@4.39.0             rcon-client@4.2.5             vec3@0.2.0

      - name: Resolve and verify official Mojang 26.1.1 server jar
        run: |
          set -euo pipefail
          mkdir -p work/worldbuilder/server
          curl --fail --silent --show-error             https://piston-meta.mojang.com/mc/game/version_manifest_v2.json             -o work/worldbuilder/version-manifest.json

          python3 - <<'PY'
          import json, pathlib, urllib.request
          root = pathlib.Path("work/worldbuilder")
          manifest = json.loads((root / "version-manifest.json").read_text())
          version = next(v for v in manifest["versions"] if v["id"] == "26.1.1")
          data = json.load(urllib.request.urlopen(version["url"]))
          server = data["downloads"]["server"]
          meta = {
              "id": data["id"],
              "type": data["type"],
              "releaseTime": data["releaseTime"],
              "server_url": server["url"],
              "server_sha1": server["sha1"],
              "server_size": server["size"],
              "version_metadata_url": version["url"],
          }
          (root / "server-version.json").write_text(json.dumps(meta, indent=2) + "\n")
          urllib.request.urlretrieve(server["url"], root / "server/server.jar")
          PY

          cd work/worldbuilder/server
          EXPECTED="$(python3 -c 'import json; print(json.load(open("../server-version.json"))["server_sha1"])')"
          ACTUAL="$(sha1sum server.jar | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          echo "official server sha1 verified: $ACTUAL"

      - name: Configure blank vanilla canvas
        run: |
          cat > work/worldbuilder/server/server.properties <<'EOF'
          server-port=25565
          online-mode=false
          enforce-secure-profile=false
          gamemode=creative
          force-gamemode=true
          difficulty=peaceful
          spawn-protection=0
          generate-structures=false
          level-type=minecraft:flat
          view-distance=8
          simulation-distance=8
          allow-flight=true
          op-permission-level=4
          enable-rcon=true
          rcon.port=25575
          rcon.password=relatte-ci
          enable-query=false
          motd=reLATTE VANILLA-WORLDBUILDER-006
          EOF
          echo "eula=true" > work/worldbuilder/server/eula.txt

      - name: Start official vanilla server
        run: |
          set -euo pipefail
          cd work/worldbuilder/server
          java -Xms1G -Xmx2G -jar server.jar nogui > server.log 2>&1 &
          echo $! > server.pid

          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log; then
              echo "vanilla server ready"
              exit 0
            fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 1
          done

          cat server.log
          echo "server did not become ready" >&2
          exit 1

      - name: Give bot bounded vanilla powers and say BUILD A WORLD
        env:
          MC_HOST: 127.0.0.1
          MC_PORT: "25565"
          MC_RCON_PORT: "25575"
          MC_RCON_PASSWORD: relatte-ci
          MC_BOT_NAME: WorldBuilder
          MC_WORLD_GOAL: BUILD A WORLD
          MC_VERSION_META: work/worldbuilder/server-version.json
          MC_EVIDENCE_OUT: work/worldbuilder/evidence.json
          MC_MAP_OUT: work/worldbuilder/world-map.txt
        run: |
          node --experimental-strip-types             experiments/vanilla-worldbuilder-006/worldbuilder-v4.mjs

      - name: Verify authored-world evidence and frozen core
        run: |
          set -euo pipefail
          test -s work/worldbuilder/evidence.json
          test -s work/worldbuilder/world-map.txt

          test "$(git rev-parse HEAD:src)" = "c0e4d2c59481e0fb2a4bf4bb294f373907fd2b76"

          python3 - <<'PY'
          import json
          e = json.load(open("work/worldbuilder/evidence.json"))
          assert e["goal"] == "BUILD A WORLD"
          assert e["version"]["id"] == "26.1.1"
          assert e["bot"]["operator"] is True
          assert e["bot"]["gamemode"] == "creative"
          assert e["claims"]["official_vanilla_server_runtime"] == "OBSERVED"
          assert e["claims"]["bot_operator_privilege"] == "OBSERVED"
          assert e["claims"]["bounded_autonomous_world_plan"] == "OBSERVED"
          assert e["claims"]["bot_issued_world_commands"] == "OBSERVED"
          assert e["claims"]["fresh_non_op_client_scanned_final_region"] == "OBSERVED"
          assert e["claims"]["author_and_observer_are_distinct_client_sessions"] == "OBSERVED"
          assert e["claims"]["authored_world_crossed_relatte"] == "OBSERVED"
          assert e["receipt"]["kind"] == "R3_HOLD"
          assert len(e["plan"]["districts"]) == 4
          assert len(set(e["plan"]["districts"])) == 4
          assert e["scan"]["non_air_blocks"] > 10000
          print(json.dumps({
              "goal": e["goal"],
              "palette": e["plan"]["palette"]["name"],
              "districts": e["plan"]["districts"],
              "operations": len(e["plan"]["operations"]),
              "anchors": len(e["plan"]["anchors"]),
              "non_air_blocks": e["scan"]["non_air_blocks"],
              "plan_sha256": e["plan"]["plan_sha256"],
              "field_sha256": e["scan"]["field_sha256"],
              "crossing_id": e["crossing"]["crossing_id"],
              "receipt_id": e["receipt"]["receipt_id"],
          }, indent=2))
          PY

          echo
          echo "WORLD MAP"
          cat work/worldbuilder/world-map.txt

      - name: Preserve authored world evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-worldbuilder-006-evidence
          path: |
            work/worldbuilder/evidence.json
            work/worldbuilder/world-map.txt
            work/worldbuilder/server-version.json
            work/worldbuilder/server/server.log
            work/worldbuilder/server/world/level.dat
            work/worldbuilder/server/world/region/
          if-no-files-found: warn
          retention-days: 7
