name: Cloudflare Durable reLATTE pilot (no deploy)

on:
  pull_request:
    paths:
      - "experiments/cloudflare-do/**"
      - "src/protocol.ts"
      - "src/canonical.ts"
      - ".github/workflows/cloudflare-durable-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test exact reLATTE crossing/receipt crypto on SQLite-style durable adapter
        run: node --test --experimental-strip-types experiments/cloudflare-do/test/*.test.mjs
      - name: Bundle Cloudflare Worker without uploading or attaching domains
        run: npx --yes wrangler@4.102.0 deploy --dry-run --config experiments/cloudflare-do/wrangler.jsonc --outdir .tmp-edge-bundle
