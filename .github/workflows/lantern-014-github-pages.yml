name: 'LANTERN 014 — publish private-by-default Solo Desk via GitHub Pages (no Vercel)'

on:
  push:
    branches:
      - experiment/lantern-014-public-pages
    paths:
      - 'experiments/lantern-commons-014/**'
      - '.github/workflows/lantern-014-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lantern-014-pages
  cancel-in-progress: false

jobs:
  inspect-and-build:
    name: Validate standalone HTML and check Pages hosting without overwriting another site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run all executable JAR;VIS Solo Desk local-use tests
        run: node --test experiments/lantern-commons-014/test_solo_desk.mjs
      - name: Build exact offline one-file app as website root
        run: |
          set -euo pipefail
          mkdir -p site
          cp experiments/lantern-commons-014/Lantern_014_The_Solo_Desk.html site/index.html
          printf 'LANTERN-014\n' > site/.well-known-project
          touch site/.nojekyll
          test "$(sha256sum site/index.html | awk '{print $1}')" = "$(sha256sum experiments/lantern-commons-014/Lantern_014_The_Solo_Desk.html | awk '{print $1}')"
          python3 - <<'PY'
          from pathlib import Path
          import re
          source=Path('site/index.html').read_text()
          assert source.count('<script>')==1
          assert not re.search(r'<script[^>]+src=',source,re.I)
          assert not re.search(r'\b(?:fetch|XMLHttpRequest|WebSocket|sendBeacon)\s*\(',source)
          assert 'JAR;VIS · executable offers' in source
          assert 'JARVIS_OFFERS' in source
          print('EXACT_OFFLINE_JARVIS_SITE_BUILD_OK',len(source))
          PY
      - name: Inspect GitHub Pages setup and avoid taking over an existing production site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          repo=os.environ['GITHUB_REPOSITORY']
          req=urllib.request.Request(
              'https://api.github.com/repos/'+repo+'/pages',
              headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'Lantern014-Pages-Safety-Check'
              }
          )
          try:
              with urllib.request.urlopen(req,timeout=15) as response:
                  page=json.load(response)
          except urllib.error.HTTPError as e:
              if e.code in (404,403):
                  print('PAGES_NEEDS_USER_ENABLEMENT',e.code,
                  '\nONE-TIME SETTING: Repo Settings > Pages > Build and deployment > Source = GitHub Actions.',
                  '\nRepo URL: https://github.com/'+repo+'/settings/pages')
                  raise SystemExit(2)
              raise
          url=page.get('html_url','')
          cname=page.get('cname')
          source=page.get('source') or {}
          print('PAGES_ENABLED',json.dumps({'url':url,'cname':cname,'source':source,'build_type':page.get('build_type')},sort_keys=True))
          if cname:
              raise SystemExit('REFUSE_OVERWRITE_EXISTING_CUSTOM_PAGES_DOMAIN')
          expected='https://the-static-collective.github.io/reLATTE/'
          if not url.lower().rstrip('/').endswith('/relatte'):
              raise SystemExit('REFUSE_UNEXPECTED_PAGES_DESTINATION')
          # Existing public site is protected. Only update if our own marker
          # exists, or there is no published page yet.
          try:
              with urllib.request.urlopen(expected,timeout=15) as response:
                  old=response.read(200000).decode('utf-8','replace')
                  if 'LANTERN 014' not in old and 'JAR;VIS · executable offers' not in old:
                      raise SystemExit('REFUSE_TO_REPLACE_UNRELATED_EXISTING_PAGES_SITE')
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
          print('SAFE_TO_DEPLOY_SOLO_DESK')
          PY
      - name: Configure GitHub Pages for static artifact
        uses: actions/configure-pages@v5
      - name: Upload the exact validated app to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: inspect-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish official GitHub Pages site (no paid host)
        id: publish
        uses: actions/deploy-pages@v4

  verify-public:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify actual public website serves the current working JAR;VIS tool
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time,urllib.request,urllib.error
          url='https://the-static-collective.github.io/reLATTE/'
          for n in range(30):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Lantern014-HTTP-Witness'})
                  with urllib.request.urlopen(req,timeout=12) as r:
                      payload=r.read(200000).decode('utf-8','replace')
                      assert '<title>LANTERN 014' in payload
                      assert 'JAR;VIS · executable offers' in payload
                      assert 'Lantern_JARVIS_Work_Tracker.csv' in payload
                      assert r.status==200
                      print('LIVE_PUBLIC_HTTPS_CONFIRMED',url,'status',r.status,'bytes',len(payload))
                      break
              except (urllib.error.URLError,AssertionError) as e:
                  print('Publish propagation not yet verified, attempt',n+1,str(e)[:180])
                  time.sleep(5)
          else:
              raise SystemExit('LIVE_PUBLIC_HTTPS_NOT_VERIFIED')
          PY
