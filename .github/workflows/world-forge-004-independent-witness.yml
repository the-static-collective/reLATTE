name: WORLD-FORGE-004 independent engine readers

on:
  push:
    branches:
      - experiment/world-forge-004-independent-witness
    paths:
      - 'experiments/world-forge-004/**'
      - '.github/workflows/world-forge-004-independent-witness.yml'
  pull_request:
    paths:
      - 'experiments/world-forge-004/**'
      - '.github/workflows/world-forge-004-independent-witness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: bounded witness hostile tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed evidence parser
        run: node --test experiments/world-forge-004/tests/verify.test.mjs

  minecraft:
    name: Minecraft official non-OP observation / ${{ matrix.world }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - {world: alpha, seed: 381654729}
          - {world: beta, seed: 918273645}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build original fixture and crater datapack
        run: |
          node experiments/world-forge-001/src/build.mjs
          node experiments/crater-smash-002/src/build.mjs
      - name: Install pinned independent protocol client and operator RCON
        run: npm install --no-save --ignore-scripts mineflayer@4.39.0 vec3@0.2.0 rcon-client@4.2.5
      - name: Download and verify official Mojang Java 26.1.1 server
        run: |
          set -euo pipefail
          mkdir -p work/minecraft-probe/server
          python3 - <<'PY'
          import json,hashlib,pathlib,urllib.request
          root=pathlib.Path('work/minecraft-probe')
          with urllib.request.urlopen('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json') as r:
              manifest=json.load(r)
          version=next(v for v in manifest['versions'] if v['id']=='26.1.1')
          with urllib.request.urlopen(version['url']) as r:
              data=json.load(r)
          payload=urllib.request.urlopen(data['downloads']['server']['url']).read()
          actual=hashlib.sha1(payload).hexdigest()
          if actual!=data['downloads']['server']['sha1']:raise ValueError('official jar hash mismatch')
          (root/'server/server.jar').write_bytes(payload)
          (root/'server-version.json').write_text(json.dumps({'id':data['id'],'server_sha1':actual,'releaseTime':data['releaseTime']})+'\n')
          print('Official runtime manifest verified:',data['id'],actual)
          PY
      - name: Configure disposable loopback-bound world and original datapack
        env:
          WF_SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          root=work/minecraft-probe/server
          mkdir -p "$root/world/datapacks/crater-smash-002"
          cp -r experiments/crater-smash-002/dist/minecraft/. "$root/world/datapacks/crater-smash-002/"
          cat > "$root/server.properties" <<EOF
          level-name=world
          server-port=25565
          server-ip=127.0.0.1
          online-mode=false
          enforce-secure-profile=false
          gamemode=creative
          force-gamemode=true
          difficulty=peaceful
          generate-structures=false
          level-type=minecraft:flat
          level-seed=$WF_SEED
          view-distance=6
          simulation-distance=6
          enable-rcon=true
          rcon.port=25575
          rcon.password=worldforge-004-ephemeral-ci
          motd=WF004 ephemeral CI; no public server
          EOF
          echo 'eula=true' > "$root/eula.txt"
      - name: Launch official server and wait until ready
        run: |
          set -euo pipefail
          cd work/minecraft-probe/server
          java -Xms512M -Xmx2G -jar server.jar nogui >server.log 2>&1 &
          echo $! >server.pid
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log; then echo 'Mojang server ready';exit 0;fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then tail -100 server.log;exit 1;fi
            sleep 1
          done
          tail -100 server.log;exit 1
      - name: Separate non-OP Mineflayer client observes actual intermediate blocks
        env:
          WF_WORLD: ${{ matrix.world }}
          WF_RCON_PASSWORD: worldforge-004-ephemeral-ci
        run: |
          node experiments/world-forge-004/minecraft/author-and-observe.mjs
          test -s "work/minecraft-probe/minecraft-$WF_WORLD.json"
          test -s "work/minecraft-probe/author-trace-$WF_WORLD.json"
      - name: Preserve observer, author and actual Mojang runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-forge-004-minecraft-${{ matrix.world }}
          path: |
            work/minecraft-probe/minecraft-${{ matrix.world }}.json
            work/minecraft-probe/author-trace-${{ matrix.world }}.json
            work/minecraft-probe/server-version.json
            work/minecraft-probe/server/server.log
          if-no-files-found: warn
          retention-days: 7

  godot:
    name: Godot 4.4.1 independent snapshot process / ${{ matrix.world }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        world: [alpha, beta]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download pinned official Godot 4.4.1
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --silent --show-error \
            https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --version
      - name: Engine process A writes three bounded BoxMesh scene snapshots
        env:
          WF_WORLD: ${{ matrix.world }}
        run: |
          set -euo pipefail
          mkdir -p experiments/world-forge-004/godot/snapshots work/world-forge-004
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path experiments/world-forge-004/godot \
            --script res://operator-run.gd 2>&1 | tee work/world-forge-004/godot-author.log
          for stage in build impact repair; do
            test -s "experiments/world-forge-004/godot/snapshots/$WF_WORLD-$stage.tscn"
          done
      - name: Independent fresh engine process B reads only saved scenes
        env:
          WF_WORLD: ${{ matrix.world }}
        run: |
          set -euo pipefail
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path experiments/world-forge-004/godot \
            --script res://observe-run.gd 2>&1 | tee work/world-forge-004/godot-observer.log
          node experiments/world-forge-004/src/parse-godot.mjs "$WF_WORLD" \
            work/world-forge-004/godot-observer.log \
            experiments/world-forge-004/godot/snapshots \
            "work/world-forge-004/godot-$WF_WORLD.json"
      - name: Preserve independent Godot output and raw scene files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-forge-004-godot-${{ matrix.world }}
          path: |
            work/world-forge-004/godot-${{ matrix.world }}.json
            work/world-forge-004/godot-author.log
            work/world-forge-004/godot-observer.log
            experiments/world-forge-004/godot/snapshots/
          if-no-files-found: warn
          retention-days: 7

  compare:
    name: four original engine observation artifacts compare under HOLD
    needs: [minecraft, godot]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: world-forge-004-*
          path: work/wf004-inputs
          merge-multiple: false
      - name: Verify four distinct actual observations and keep receiver HOLD
        run: |
          node experiments/world-forge-004/src/verify.mjs work/wf004-inputs work/wf004-comparison.json
          test -s work/wf004-comparison.json
      - name: Preserve verified bounded comparison
        uses: actions/upload-artifact@v4
        with:
          name: world-forge-004-comparison-held
          path: work/wf004-comparison.json
          retention-days: 7
