name: INTERFACE-SUPERSPACE-001
on:
  push:
    branches: [experiment/interface-superspace-001]
  pull_request:
    paths:
      - 'experiments/interface-superspace-001/**'
      - 'experiments/alien-minecraft-vanilla-005/**'
      - '.github/workflows/interface-superspace-001.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  superspace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/tranchNOSE
          ref: 670ca60012929b51e66b8bac7d0c9b85a4f95d7b
          path: work/donors/tranchNOSE
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/GHoT
          ref: e35dd470384d864b7b0b629a68dad570875a7df0
          path: work/donors/GHoT
          persist-credentials: false
      - run: npm ci
      - name: Hostile experiment tests and existing repository verification
        env:
          TRANCHNOSE_ROOT: work/donors/tranchNOSE
          GHOT_ROOT: work/donors/GHoT
        run: |
          npm run superspace:test
          npm run verify
      - name: Install pinned vanilla clients and verify the official server
        run: |
          npm install --no-save --ignore-scripts mineflayer@4.39.0 mineflayer-pathfinder@2.4.5 rcon-client@4.2.5 vec3@0.2.0 minecraft-data@3.114.0
          python3 experiments/interface-superspace-001/setup-minecraft.py
      - name: Start disposable official vanilla server
        working-directory: work/minecraft/server
        run: |
          java -Xms512M -Xmx2G -jar server.jar nogui > server.log 2>&1 &
          echo $! > server.pid
          python3 - <<'PY'
          import pathlib, time
          for attempt in range(120):
              if 'Done (' in pathlib.Path('server.log').read_text():
                  break
              time.sleep(1)
          else:
              raise SystemExit('official vanilla server did not start')
          PY
      - name: Execute synthesized routes, including live vanilla Minecraft
        env:
          TRANCHNOSE_ROOT: work/donors/tranchNOSE
          GHOT_ROOT: work/donors/GHoT
        run: node experiments/interface-superspace-001/run.mjs --minecraft
      - name: Verify recorded plans, observed routes, signed crossings and freeze
        run: node experiments/interface-superspace-001/verify-run.mjs work/interface-superspace-001/proofs.json --require-minecraft
      - name: Preserve native route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-superspace-001-evidence
          path: |
            work/interface-superspace-001/
            work/minecraft/server-version.json
            work/minecraft/server/server.log
          retention-days: 14
