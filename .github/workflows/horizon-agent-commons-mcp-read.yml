name: Horizon Agent Commons — MCP Read-Only Probe

on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: "Type READ to inspect public MCP tools and capabilities (never writes)."
        required: true
        type: string

permissions:
  contents: read

jobs:
  discover:
    if: ${{ inputs.confirm_read_only == 'READ' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run offline MCP tests
        run: python3 -m unittest discover -s adapters/horizon_agent_commons -p 'test_*.py'
      - name: Discover live MCP tools and read capabilities
        run: python3 adapters/horizon_agent_commons/mcp_readonly.py --live --output "${RUNNER_TEMP}/horizon-mcp-observation.json"
      - name: Upload machine-readable discovery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-mcp-discovery
          path: ${{ runner.temp }}/horizon-mcp-observation.json
          if-no-files-found: ignore
