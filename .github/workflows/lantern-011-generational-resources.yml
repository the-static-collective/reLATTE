name: 'LANTERN-011 finite material inheritance across versioned Minecraft world cartridges'

on:
  push:
    branches:
      - experiment/lantern-commons-011-generational-resources
    paths:
      - 'experiments/lantern-commons-011/**'
      - '.github/workflows/lantern-011-generational-resources.yml'
  pull_request:
    paths:
      - 'experiments/lantern-commons-011/**'
      - '.github/workflows/lantern-011-generational-resources.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prove-offline-contracts:
    name: Security-check world archive and finite-source generation experiment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: All inherited world-cartridge archive hostile checks
        run: |
          python3 -m unittest discover -v -s experiments/lantern-commons-010 -p test_world_cartridge.py
          python3 -m py_compile experiments/lantern-commons-011/verify_generations.py experiments/lantern-commons-011/ci_server.py
          node --check experiments/lantern-commons-011/live_inheritance.mjs
      - name: Prevent accidental resource injection commands from entering game source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('experiments/lantern-commons-011/datapack/data/lantern/function/generations')
          allowed={'setblock','data','execute'}
          for f in p.glob('*.mcfunction'):
              for line in f.read_text().splitlines():
                  line=line.strip()
                  if not line or line.startswith('#'): continue
                  if line.split()[0] not in allowed: raise ValueError(f'{f.name}: banned command {line}')
                  if re.search(r'\b(give|clear|loot|item replace|clone)\b',line,re.I): raise ValueError('resource injection')
          print('GAME_SOURCE_HAS_NO_ITEM_MINTING_COMMAND')
          PY

  first-descendants:
    name: Branch immutable 010 Mutual Aid save into ${{ matrix.branch }} @0.1.2
    needs: [prove-offline-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        branch: [silo, steward]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install original reLATTE game clients and witnesses
        run: |
          npm install --ignore-scripts
          npm install --no-save --ignore-scripts mineflayer@4.39.0 rcon-client@4.2.5 vec3@0.2.0
      - name: Download exact original 010 Mutual Aid WORLD save, not a generated recipe
        uses: actions/download-artifact@v4
        with:
          name: lantern-world-010-mutual_aid-v0.1.1
          repository: the-static-collective/reLATTE
          run-id: 41722731806
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: work/parent
      - name: Verify full byte-bound parent and checkout to a new, absent save folder
        run: |
          set -euo pipefail
          python3 experiments/lantern-commons-010/world_cartridge.py verify work/parent/branch-mutual_aid.zip
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('wc','experiments/lantern-commons-010/world_cartridge.py')
          wc=importlib.util.module_from_spec(spec);spec.loader.exec_module(wc)
          m,_=wc.inspect('work/parent/branch-mutual_aid.zip')
          assert m['cartridge_id']=='b45537517d670812a7dc337c4e4881918ff2f477b2b2de7ddc253a7e86f5c5c6'
          print('SOURCE_WORLD_CARTRIDGE_PINNED',m['cartridge_id'])
          PY
          mkdir -p work/lantern/server
          python3 experiments/lantern-commons-010/world_cartridge.py checkout \
            work/parent/branch-mutual_aid.zip work/lantern/server/world
      - name: Fetch and verify exact original official Minecraft Java 26.1.1 engine
        run: |
          python3 experiments/lantern-commons-011/ci_server.py official --parent work/parent/branch-mutual_aid.zip
          python3 experiments/lantern-commons-011/ci_server.py config --parent work/parent/branch-mutual_aid.zip
      - name: Boot copied saved world without resetting ANY source goods
        run: |
          set -euo pipefail
          cd work/lantern/server
          java -Xms1G -Xmx2G -jar server.jar nogui >server.log 2>&1 &
          echo $! >server.pid
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log; then echo 'INHERITED_WORLD_IS_LIVE'; exit 0; fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then cat server.log; exit 1; fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: Verify actual inherited Minecraft barrels and test the selected branch
        env:
          MC_RCON_PASSWORD: lantern-ci-only
          LANTERN_011_STAGE: ${{ matrix.branch }}
          LANTERN_011_PARENT_ID: b45537517d670812a7dc337c4e4881918ff2f477b2b2de7ddc253a7e86f5c5c6
          LANTERN_011_SEED: '314159265'
        run: node experiments/lantern-commons-011/live_inheritance.mjs
      - name: Save and exit Minecraft before sealing new complete-save version
        if: always()
        env:
          MC_RCON_PASSWORD: lantern-ci-only
        run: |
          node --input-type=module - <<'JS' || true
          import {Rcon} from 'rcon-client';
          const c=await Rcon.connect({host:'127.0.0.1',port:25575,password:process.env.MC_RCON_PASSWORD});
          await c.send('save-all flush'); await c.send('stop'); c.end();
          JS
          for i in $(seq 1 45); do
            if ! kill -0 "$(cat work/lantern/server/server.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
      - name: Seal the entire inherited SAVE as an immutable 0.1.2 child of 010 Mutual Aid
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          OBS_SHA="$(sha256sum work/inheritance/game-observation.json | cut -d' ' -f1)"
          SRC_SHA="$(printf '%s' "$GITHUB_SHA" | sha256sum | cut -d' ' -f1)"
          JAR_SHA="$(python3 -c "import json; print(json.load(open('work/lantern/server-meta.json'))['jar_sha1'])")"
          python3 experiments/lantern-commons-010/world_cartridge.py pack \
            --world work/lantern/server/world \
            --out "work/inheritance/$BRANCH-v0.1.2.zip" --parent work/parent/branch-mutual_aid.zip \
            --version 0.1.2 --branch "$BRANCH" --seed 314159265 \
            --mojang-sha1 "$JAR_SHA" --source-sha256 "$SRC_SHA" \
            --observation-sha256 "$OBS_SHA" --action "GENERATION_011_${BRANCH}_NO_REPROVISION"
          python3 experiments/lantern-commons-010/world_cartridge.py verify "work/inheritance/$BRANCH-v0.1.2.zip"
      - name: Keep the entire distinct child saved world, game observations and byte receipt
        uses: actions/upload-artifact@v4
        with:
          name: lantern-world-011-${{ matrix.branch }}-v0.1.2
          if-no-files-found: error
          retention-days: 90
          path: |
            work/inheritance/*.zip
            work/inheritance/*.receipt.json
            work/inheritance/game-observation.json

  grandchild:
    name: Copy the exact invested world and inherit its finite game stock @0.1.3
    needs: [first-descendants]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install real game clients
        run: |
          npm install --ignore-scripts
          npm install --no-save --ignore-scripts mineflayer@4.39.0 rcon-client@4.2.5 vec3@0.2.0
      - name: Download exact silo saved-world cartridge, NOT earlier root
        uses: actions/download-artifact@v4
        with:
          name: lantern-world-011-silo-v0.1.2
          path: work/parent
      - name: Verify exact parent and checkout second-generation save without overwrite
        run: |
          set -euo pipefail
          python3 experiments/lantern-commons-010/world_cartridge.py verify work/parent/silo-v0.1.2.zip
          mkdir -p work/lantern/server
          python3 experiments/lantern-commons-010/world_cartridge.py checkout \
            work/parent/silo-v0.1.2.zip work/lantern/server/world
          python3 - <<'PY' >> "$GITHUB_ENV"
          import importlib.util
          spec=importlib.util.spec_from_file_location('wc','experiments/lantern-commons-010/world_cartridge.py')
          wc=importlib.util.module_from_spec(spec);spec.loader.exec_module(wc)
          m,_=wc.inspect('work/parent/silo-v0.1.2.zip')
          if m['branch']!='silo' or m['version']!='0.1.2': raise ValueError('Wrong parent')
          print('LANTERN_011_PARENT_ID='+m['cartridge_id'])
          PY
      - name: Verify same exact engine and refuse unsanctioned inherited datapack drift
        run: |
          python3 experiments/lantern-commons-011/ci_server.py official --parent work/parent/silo-v0.1.2.zip
          python3 experiments/lantern-commons-011/ci_server.py config --parent work/parent/silo-v0.1.2.zip
      - name: Boot the inherited full silo world as another distinct official Minecraft server
        run: |
          set -euo pipefail
          cd work/lantern/server
          java -Xms1G -Xmx2G -jar server.jar nogui >server.log 2>&1 &
          echo $! >server.pid
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log; then echo 'THE_INHERITED_SILO_HEIR_WORLD_IS_LIVE'; exit 0; fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then cat server.log; exit 1; fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: Relocate inherited material using fresh non-OP player, with no operator item supply
        env:
          MC_RCON_PASSWORD: lantern-ci-only
          LANTERN_011_STAGE: silo_heir
          LANTERN_011_SEED: '314159265'
        run: node experiments/lantern-commons-011/live_inheritance.mjs
      - name: Shut down and flush save before sealing grandchild world
        if: always()
        env:
          MC_RCON_PASSWORD: lantern-ci-only
        run: |
          node --input-type=module - <<'JS' || true
          import {Rcon} from 'rcon-client';
          const c=await Rcon.connect({host:'127.0.0.1',port:25575,password:process.env.MC_RCON_PASSWORD});
          await c.send('save-all flush'); await c.send('stop'); c.end();
          JS
          for i in $(seq 1 45); do
            if ! kill -0 "$(cat work/lantern/server/server.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
      - name: Seal the grandchild world save as precisely silo's direct descendant
        run: |
          set -euo pipefail
          OBS_SHA="$(sha256sum work/inheritance/game-observation.json | cut -d' ' -f1)"
          SRC_SHA="$(printf '%s' "$GITHUB_SHA" | sha256sum | cut -d' ' -f1)"
          JAR_SHA="$(python3 -c "import json; print(json.load(open('work/lantern/server-meta.json'))['jar_sha1'])")"
          python3 experiments/lantern-commons-010/world_cartridge.py pack \
            --world work/lantern/server/world \
            --out work/inheritance/silo_heir-v0.1.3.zip \
            --parent work/parent/silo-v0.1.2.zip \
            --version 0.1.3 --branch silo_heir --seed 314159265 \
            --mojang-sha1 "$JAR_SHA" --source-sha256 "$SRC_SHA" \
            --observation-sha256 "$OBS_SHA" --action "GENERATION_011_INHERITED_SEED_VAULT_WITH_ZERO_MINTING"
          python3 experiments/lantern-commons-010/world_cartridge.py verify work/inheritance/silo_heir-v0.1.3.zip
      - name: Preserve exact third-generation full saved world and real material observation
        uses: actions/upload-artifact@v4
        with:
          name: lantern-world-011-silo_heir-v0.1.3
          if-no-files-found: error
          retention-days: 90
          path: |
            work/inheritance/*.zip
            work/inheritance/*.receipt.json
            work/inheritance/game-observation.json

  genealogy:
    name: Verify actual 010 source → two 011 children → a copied 011 grandchild
    needs: [grandchild]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve exact original 010 Mutual Aid world save
        uses: actions/download-artifact@v4
        with:
          name: lantern-world-010-mutual_aid-v0.1.1
          repository: the-static-collective/reLATTE
          run-id: 41722731806
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: work/parent
      - name: Retrieve both child cartridge full world saves
        uses: actions/download-artifact@v4
        with:
          pattern: lantern-world-011-*
          path: work/children
          merge-multiple: false
      - name: Inspect two inherited child worlds and a third-generation descendant from actual byte-verified parents
        run: |
          set -euo pipefail
          python3 experiments/lantern-commons-011/verify_generations.py \
            --parent work/parent/branch-mutual_aid.zip \
            --silo work/children/lantern-world-011-silo-v0.1.2/silo-v0.1.2.zip \
            --silo-observation work/children/lantern-world-011-silo-v0.1.2/game-observation.json \
            --steward work/children/lantern-world-011-steward-v0.1.2/steward-v0.1.2.zip \
            --steward-observation work/children/lantern-world-011-steward-v0.1.2/game-observation.json \
            --silo-heir work/children/lantern-world-011-silo_heir-v0.1.3/silo_heir-v0.1.3.zip \
            --heir-observation work/children/lantern-world-011-silo_heir-v0.1.3/game-observation.json \
            --out work/inheritance-dag/lineage.json
      - name: Preserve exact verified genealogy, multiple versions and real-game resource totals
        uses: actions/upload-artifact@v4
        with:
          name: lantern-world-011-multi-generation-dag
          if-no-files-found: error
          retention-days: 90
          path: work/inheritance-dag/lineage.json
