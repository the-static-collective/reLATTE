name: ACTS-4-BOUNDARY-001 authority boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/acts4-boundary-001/requirements.txt
      - name: Original hostile suite and durable authority extraction
        run: python -m unittest discover -s experiments/acts4-boundary-001 -v
      - name: Independently replay the original paired-world specimen
        run: python experiments/acts4-boundary-001/experiment.py
      - name: Verify preserved signed inputs and golden receipt
        run: python experiments/acts4-boundary-001/golden_receipt.py --check
